name: Build APK

on:
  push:
    branches: [master, main]
  workflow_dispatch:  # 允许手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: 安装 Buildozer 依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            python3-pip python3-venv git zip unzip openjdk-17-jdk \
            autoconf libtool pkg-config zlib1g-dev libncurses5-dev \
            libncursesw5-dev cmake libffi-dev libssl-dev \
            libltdl-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libgstreamer-plugins-good1.0-dev libgstreamer-plugins-bad1.0-dev \
            gstreamer1.0-tools gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good gstreamer1.0-plugins-bad \
            libgdal-dev libgtk-3-dev libpq-dev libsqlite3-dev libreadline-dev \
            libbz2-dev libxml2-dev libxslt1-dev liblzma-dev
        env:
          DEBIAN_FRONTEND: noninteractive

      - name: 准备打包目录（把 App 代码放到根）
        run: |
          mkdir -p build_app
          # 复制 App 相关文件到打包根目录
          cp android/chat_app.py build_app/main.py
          cp android/buildozer.spec build_app/
          cp android/用户头像.png build_app/
          cp android/ai助手头像.png build_app/
          echo "=== 打包目录内容 ==="
          ls -la build_app/

      - name: 安装 Buildozer
        working-directory: build_app
        run: |
          python3 -m venv venv
          source venv/bin/activate
          pip install --upgrade pip
          pip install buildozer
          buildozer --version

      - name: 打包 APK
        working-directory: build_app
        run: |
          source venv/bin/activate
          # 预下载 Android SDK 到缓存
          export ANDROIDSDK="$HOME/.buildozer/android/platform"
          # 打包（首次会下载 SDK/NDK，约 5-10 分钟）
          buildozer -v android debug 2>&1 | tail -50
        timeout-minutes: 60

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: campus-agent-apk
          path: build_app/bin/*.apk
