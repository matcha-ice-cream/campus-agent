name: Build APK

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: kivy/buildozer:latest
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: 准备打包目录
        run: |
          mkdir -p build_app
          cp android/chat_app.py build_app/main.py
          cp android/buildozer.spec build_app/
          cp android/用户头像.png build_app/
          cp android/ai助手头像.png build_app/
          ls -la build_app/

      # 第一步：跑一次 buildozer 让源码下载（失败是预期，config.pxi 缺失）
      - name: 预下载源码（预期失败）
        working-directory: build_app
        continue-on-error: true
        run: |
          yes | buildozer -v android debug > /tmp/build_first.log 2>&1 || true
          echo "第一次构建结束（预期失败）"

      # 第二步：找到 Kivy 源码，手动生成 config.pxi（p4a 跳过 setup.py 的替代方案）
      - name: 手动生成 Kivy config.pxi
        working-directory: build_app
        run: |
          set -e
          KIVY_DIR=$(find .buildozer -type d -name "kivy-2*" | head -1)
          echo "Kivy 源码目录: $KIVY_DIR"
          if [ -n "$KIVY_DIR" ]; then
            cd "$KIVY_DIR"
            python3 -c "from pathlib import Path; Path('kivy/include').mkdir(parents=True, exist_ok=True)"
            cat > kivy/include/config.pxi << 'EOF'
DEF KIVY_SDL2 = 1
DEF KIVY_NO_ARGS = 0
DEF KIVY_NO_CONSOLELOG = 0
DEF KIVY_WINDOW = "sdl2"
DEF KIVY_GL_BACKEND = "sdl2"
EOF
            echo "config.pxi 已生成"
            cd -
          else
            echo "警告：未找到 Kivy 源码目录"
          fi

      # 第三步：正式打包
      - name: 打包 APK
        working-directory: build_app
        run: |
          yes | buildozer -v android debug > /tmp/build_full.log 2>&1 || {
            echo "=== 打包失败，关键错误 ==="
            grep -B2 -A8 "config.pxi\|What went wrong\|Execution failed\|error:" /tmp/build_full.log | head -50
            cp /tmp/build_full.log /tmp/build_full_for_artifact.log
            exit 1
          }
          echo "=== 打包完成 ==="
          ls -la bin/ 2>/dev/null || echo "bin 目录不存在"
        timeout-minutes: 60

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: campus-agent-apk
          path: build_app/bin/*.apk

      - name: 上传完整日志（失败排查用）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-full-log
          path: /tmp/build_full_for_artifact.log
