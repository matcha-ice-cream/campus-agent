name: Build APK

on:
  push:
    branches: [master, main]
  workflow_dispatch:  # 允许手动触发

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: 安装 Buildozer 依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-pip python3-venv git zip unzip openjdk-17-jdk \
            autoconf libtool pkg-config zlib1g-dev libncurses5-dev \
            libncursesw5-dev cmake libffi-dev libssl-dev
        env:
          DEBIAN_FRONTEND: noninteractive

      - name: 准备打包目录（把 App 代码放到根）
        run: |
          mkdir -p build_app
          # 复制 App 相关文件到打包根目录
          cp android/chat_app.py build_app/main.py
          cp android/buildozer.spec build_app/
          cp android/用户头像.png build_app/
          cp android/ai助手头像.png build_app/
          echo "=== 打包目录内容 ==="
          ls -la build_app/

      - name: 安装 Buildozer
        working-directory: build_app
        run: |
          python3 -m venv venv
          source venv/bin/activate
          pip install --upgrade pip
          pip install buildozer
          buildozer --version

      - name: 打包 APK
        working-directory: build_app
        run: |
          source venv/bin/activate
          export ANDROIDSDK="$HOME/.buildozer/android/platform"
          # 完整日志存文件
          yes | buildozer -v android debug > /tmp/build_full.log 2>&1 || {
            echo "=== 打包失败，提取错误关键行 ==="
            grep -E "ERROR|error:|Error|failed|Command failed|Cython error|undeclared|does not" /tmp/build_full.log | tail -30
            echo "=== 完整日志最后30行 ==="
            tail -30 /tmp/build_full.log
            exit 1
          }
          echo "=== 打包完成 ==="
          ls -la bin/ 2>/dev/null || echo "bin 目录不存在"
        timeout-minutes: 60

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: campus-agent-apk
          path: build_app/bin/*.apk
