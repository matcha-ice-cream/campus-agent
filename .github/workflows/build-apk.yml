name: Build APK

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: kivy/buildozer:latest
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: 准备打包目录
        run: |
          mkdir -p build_app
          cp android/chat_app.py build_app/main.py
          cp android/buildozer.spec build_app/
          cp android/用户头像.png build_app/
          cp android/ai助手头像.png build_app/
          ls -la build_app/

      - name: 打包 APK
        working-directory: build_app
        run: |
          # 预生成 Kivy 的 config.pxi（p4a 跳过 setup.py 导致缺失）
          # 先让 buildozer 准备源码（第一次失败是正常的，源码会下载）
          yes | buildozer -v android debug > /tmp/build_first.log 2>&1 || true
          # 找 Kivy 源码目录并手动生成 config.pxi
          KIVY_SRC=$(find .buildozer -type d -name "kivy-2*" 2>/dev/null | head -1)
          if [ -n "$KIVY_SRC" ]; then
            echo "找到 Kivy 源码: $KIVY_SRC"
            cd "$KIVY_SRC"
            python3 -c "import os; os.makedirs('kivy/include', exist_ok=True)" 2>/dev/null || true
            # 生成最小 config.pxi（声明 SDL 已找到）
            cat > kivy/include/config.pxi << 'EOF'
            DEF KIVY_SDL2 = 1
            DEF KIVY_NO_ARGS = 0
            DEF KIVY_NO_CONSOLELOG = 0
            DEF KIVY_WINDOW = "sdl2"
            EOF
            echo "config.pxi 已生成"
            cd -
          else
            echo "未找到 Kivy 源码，继续尝试打包"
          fi
          # 正式打包
          yes | buildozer -v android debug > /tmp/build_full.log 2>&1 || {
            echo "=== 打包失败，关键错误 ==="
            grep -B2 -A8 "config.pxi\|What went wrong\|Execution failed\|error:" /tmp/build_full.log | head -50
            cp /tmp/build_full.log /tmp/build_full_for_artifact.log
            exit 1
          }
          echo "=== 打包完成 ==="
          ls -la bin/ 2>/dev/null || echo "bin 目录不存在"
        timeout-minutes: 60

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: campus-agent-apk
          path: build_app/bin/*.apk

      - name: 上传完整日志（失败排查用）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-full-log
          path: /tmp/build_full_for_artifact.log
